openapi: 3.0.3
info:
  title: Holiday Wheel API
  description: |
    REST API for the Holiday Wheel game backend. This API provides authentication,
    game room management, and administrative functions for the Wheel of Fortune-style game.

    ## Authentication

    The API supports multiple authentication methods:
    - **Bearer Token**: Pass the token in the `Authorization: Bearer <token>` header
    - **Cookie**: Auth token is automatically set in an HttpOnly cookie named `auth_token`

    Both methods are supported for most authenticated endpoints.

    ## OAuth Providers

    - Google Sign-In (mobile apps via ID token, web via access token)
    - Apple Sign-In (mobile apps and web redirect flow)

    ## WebAuthn/Passkeys

    Full WebAuthn support for passwordless authentication using passkeys.
  version: 1.0.0
  contact:
    name: Holiday Wheel Support
  license:
    name: MIT

servers:
  - url: http://localhost:5000
    description: Local development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: User authentication (login, register, logout)
  - name: OAuth
    description: OAuth provider authentication (Google, Apple)
  - name: Passkey
    description: WebAuthn/Passkey authentication
  - name: User
    description: Current user operations
  - name: Rooms
    description: Game room operations
  - name: Admin - Users
    description: Administrative user management
  - name: Admin - Packs
    description: Administrative puzzle pack management
  - name: Admin - Puzzles
    description: Administrative puzzle management
  - name: Admin - Rooms
    description: Administrative room management
  - name: Admin - Settings
    description: Administrative room settings

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API server
      operationId: getHealth
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: "1.0.0"

  /auth/api/login:
    post:
      tags:
        - Authentication
      summary: Login with email and password
      description: |
        Authenticates a user with email and password. On success, returns an auth token
        and sets an HttpOnly cookie for web clients.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: securepassword123
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly auth cookie
              schema:
                type: string
                example: auth_token=abc123; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                ok: true
                token: "abc123def456..."
                user:
                  id: 1
                  email: user@example.com
                  display_name: User
        '401':
          description: Invalid credentials or unverified email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                invalid_credentials:
                  summary: Invalid email or password
                  value:
                    ok: false
                    error: Invalid email or password
                unverified:
                  summary: Email not verified
                  value:
                    ok: false
                    error: Please verify your email first

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login with email and password (alias)
      description: Alias for `/auth/api/login`
      operationId: loginAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/api/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: |
        Creates a new user account. If email verification is enabled, sends a verification
        email. If email is disabled (development mode), auto-verifies and returns user data
        for immediate login.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: newuser@example.com
              password: securepassword123
              display_name: New User
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                with_email:
                  summary: Email verification required
                  value:
                    ok: true
                    message: Registration successful! Please check your email to verify your account.
                without_email:
                  summary: Auto-verified (email disabled)
                  value:
                    ok: true
                    user:
                      id: 1
                      email: newuser@example.com
                      display_name: New User
        '400':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                ok: false
                errors:
                  - Valid email is required
                  - Password must be at least 8 characters
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                ok: false
                errors:
                  - Email already registered

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user (alias)
      description: Alias for `/auth/api/register`
      operationId: registerAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

  /auth/api/verify:
    get:
      tags:
        - Authentication
      summary: Verify auth token
      description: Validates the provided Bearer token and returns user information
      operationId: verifyToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
              example:
                ok: true
                user:
                  id: 1
                  email: user@example.com
                  display_name: User
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
              example:
                ok: false
                error: Invalid token

  /auth/verify/{token}:
    get:
      tags:
        - Authentication
      summary: Verify email address
      description: Verifies a user's email address using the token sent via email
      operationId: verifyEmail
      parameters:
        - name: token
          in: path
          required: true
          description: Email verification token
          schema:
            type: string
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              example:
                ok: true
                message: Email verified successfully! You can now log in.
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              example:
                ok: false
                error: Invalid or expired verification link

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout current user
      description: Clears the auth token from the database and cookie
      operationId: logout
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Logged out successfully
          headers:
            Set-Cookie:
              description: Cleared auth cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              example:
                ok: true
                message: Logged out

  /auth/me:
    get:
      tags:
        - User
      summary: Get current user info
      description: Returns information about the currently authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
              example:
                ok: true
                user:
                  id: 1
                  email: user@example.com
                  display_name: User
                  is_admin: true

  /auth/api/rooms:
    get:
      tags:
        - Rooms
      summary: List available game rooms
      description: Returns a list of all available game rooms with player counts
      operationId: listRooms
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: List of rooms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsResponse'
              example:
                ok: true
                rooms:
                  - name: main
                    player_count: 3
                    total_slots: 8
                  - name: family
                    player_count: 5
                    total_slots: 8
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsResponse'
              example:
                ok: false
                error: No token provided

  /auth/rooms:
    get:
      tags:
        - Rooms
      summary: List available game rooms (alias)
      description: Alias for `/auth/api/rooms`
      operationId: listRoomsAlias
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: List of rooms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsResponse'

  # OAuth Endpoints
  /auth/api/oauth/google:
    post:
      tags:
        - OAuth
      summary: Authenticate with Google
      description: |
        Authenticate using Google Sign-In. Supports two flows:
        - Mobile apps: Send the ID token (JWT) from Google Sign-In SDK
        - Web apps: Send the access token from OAuth flow

        Creates a new account if the user doesn't exist.
      operationId: googleAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
            examples:
              mobile:
                summary: Mobile app (ID token)
                value:
                  id_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6..."
              web:
                summary: Web app (access token)
                value:
                  access_token: "ya29.a0AfH6SMC..."
      responses:
        '200':
          description: Authentication successful
          headers:
            Set-Cookie:
              description: HttpOnly auth cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResponse'
              example:
                ok: true
                token: "abc123def456..."
                user:
                  id: 1
                  email: user@gmail.com
                  display_name: John Doe
                is_new_user: false
        '400':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResponse'
              example:
                ok: false
                error: No token provided. Send id_token or access_token
        '401':
          description: Token verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResponse'
              example:
                ok: false
                error: Invalid ID token
        '503':
          description: Google Sign-In not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResponse'
              example:
                ok: false
                error: Google Sign-In not configured

  /auth/api/oauth/apple:
    post:
      tags:
        - OAuth
      summary: Authenticate with Apple (mobile)
      description: |
        Authenticate using Apple Sign-In for mobile apps. Send the identity token
        received from the Apple Sign-In SDK.

        Note: Apple only provides email and name on first authorization.
      operationId: appleAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleAuthRequest'
            example:
              identity_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6..."
              email: user@privaterelay.appleid.com
              full_name:
                given_name: John
                family_name: Doe
      responses:
        '200':
          description: Authentication successful
          headers:
            Set-Cookie:
              description: HttpOnly auth cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResponse'
              example:
                ok: true
                token: "abc123def456..."
                user:
                  id: 1
                  email: user@privaterelay.appleid.com
                  display_name: John Doe
                is_new_user: true
        '401':
          description: Token verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResponse'
              example:
                ok: false
                error: Invalid token
        '503':
          description: Apple Sign-In not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResponse'
              example:
                ok: false
                error: Apple Sign-In not configured

  /auth/api/oauth/apple/authorize:
    get:
      tags:
        - OAuth
      summary: Start Apple Sign-In web flow
      description: |
        Initiates Apple Sign-In by redirecting to Apple's authorization page.
        After authentication, Apple redirects back to the callback endpoint.
      operationId: appleAuthorize
      parameters:
        - name: redirect
          in: query
          description: URL to redirect to after successful authentication (default /lobby)
          schema:
            type: string
            default: /lobby
      responses:
        '302':
          description: Redirect to Apple authorization
          headers:
            Location:
              description: Apple authorization URL
              schema:
                type: string
        '503':
          description: Apple Sign-In not configured

  /auth/api/oauth/apple/callback:
    post:
      tags:
        - OAuth
      summary: Apple Sign-In callback
      description: |
        Handles Apple's callback after user authentication. Apple POSTs form data
        with the ID token and optional user info. On success, redirects to the
        originally requested page with auth token in URL fragment.
      operationId: appleCallback
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Authorization code (not used)
                id_token:
                  type: string
                  description: JWT ID token
                state:
                  type: string
                  description: CSRF state token
                user:
                  type: string
                  description: User info JSON (only on first auth)
                error:
                  type: string
                  description: Error from Apple
      responses:
        '302':
          description: Redirect to success page with auth token
          headers:
            Location:
              description: Redirect URL with auth token in fragment
              schema:
                type: string
                example: "/lobby#auth_token=abc123&user=%7B%22id%22%3A1%7D"
            Set-Cookie:
              description: HttpOnly auth cookie
              schema:
                type: string

  # Passkey Endpoints
  /auth/api/passkey/register/start:
    post:
      tags:
        - Passkey
      summary: Start passkey registration
      description: |
        Initiates WebAuthn registration for a new user. Returns the credential
        creation options to pass to `navigator.credentials.create()`.
      operationId: passkeyRegisterStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegisterStartRequest'
            example:
              email: user@example.com
              display_name: User
      responses:
        '200':
          description: Registration options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyStartResponse'
              example:
                ok: true
                options:
                  publicKey:
                    rp:
                      name: Holiday Wheel
                      id: localhost
                    user:
                      id: "base64-encoded-id"
                      name: user@example.com
                      displayName: User
                    challenge: "base64-encoded-challenge"
                    pubKeyCredParams:
                      - type: public-key
                        alg: -7
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyStartResponse'
              example:
                ok: false
                error: Email already registered. Try logging in instead.

  /auth/api/passkey/register/finish:
    post:
      tags:
        - Passkey
      summary: Complete passkey registration
      description: |
        Completes WebAuthn registration with the credential from
        `navigator.credentials.create()`. Creates the user account and returns
        an auth token.
      operationId: passkeyRegisterFinish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegisterFinishRequest'
            example:
              email: user@example.com
              credential:
                id: "credential-id"
                rawId: "base64-raw-id"
                type: public-key
                response:
                  clientDataJSON: "base64-encoded"
                  attestationObject: "base64-encoded"
      responses:
        '200':
          description: Registration successful
          headers:
            Set-Cookie:
              description: HttpOnly auth cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyAuthResponse'
              example:
                ok: true
                token: "abc123def456..."
                user:
                  id: 1
                  email: user@example.com
                  display_name: user
        '400':
          description: Invalid credential or challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyAuthResponse'
              example:
                ok: false
                error: Challenge expired or not found

  /auth/api/passkey/login/start:
    post:
      tags:
        - Passkey
      summary: Start passkey login
      description: |
        Initiates WebAuthn authentication. Returns the credential request options
        to pass to `navigator.credentials.get()`. Email is required.
      operationId: passkeyLoginStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyLoginStartRequest'
            example:
              email: user@example.com
      responses:
        '200':
          description: Authentication options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyStartResponse'
              example:
                ok: true
                options:
                  publicKey:
                    challenge: "base64-encoded-challenge"
                    timeout: 60000
                    rpId: localhost
                    allowCredentials:
                      - type: public-key
                        id: "base64-credential-id"
        '400':
          description: No passkeys registered or email required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyStartResponse'
              example:
                ok: false
                error: No passkeys registered for this account
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyStartResponse'
              example:
                ok: false
                error: Account not found

  /auth/api/passkey/login/finish:
    post:
      tags:
        - Passkey
      summary: Complete passkey login
      description: |
        Completes WebAuthn authentication with the credential from
        `navigator.credentials.get()`. Returns an auth token on success.
      operationId: passkeyLoginFinish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyLoginFinishRequest'
            example:
              credential:
                id: "credential-id"
                rawId: "base64-raw-id"
                type: public-key
                response:
                  clientDataJSON: "base64-encoded"
                  authenticatorData: "base64-encoded"
                  signature: "base64-encoded"
      responses:
        '200':
          description: Authentication successful
          headers:
            Set-Cookie:
              description: HttpOnly auth cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyAuthResponse'
              example:
                ok: true
                token: "abc123def456..."
                user:
                  id: 1
                  email: user@example.com
                  display_name: User
        '400':
          description: Invalid credential or challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyAuthResponse'
              example:
                ok: false
                error: Authentication failed
        '404':
          description: Passkey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyAuthResponse'
              example:
                ok: false
                error: Passkey not found

  /auth/api/passkey/list:
    post:
      tags:
        - Passkey
      summary: List user's passkeys
      description: Returns all passkeys registered for the authenticated user
      operationId: listPasskeys
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: List of passkeys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyListResponse'
              example:
                ok: true
                passkeys:
                  - id: "credential-id-1"
                    device_name: iPhone 15 Pro
                    created_at: 1704067200
                    last_used_at: 1704153600
                  - id: "credential-id-2"
                    device_name: MacBook Pro
                    created_at: 1703980800
                    last_used_at: null
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyListResponse'
              example:
                ok: false
                error: Authentication required

  /auth/api/passkey/add/start:
    post:
      tags:
        - Passkey
      summary: Start adding a passkey
      description: |
        Initiates WebAuthn registration to add a new passkey to an existing account.
        Requires authentication.
      operationId: addPasskeyStart
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPasskeyStartRequest'
            example:
              device_name: iPhone 15 Pro
      responses:
        '200':
          description: Registration options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyStartResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyStartResponse'
              example:
                ok: false
                error: Authentication required

  /auth/api/passkey/add/finish:
    post:
      tags:
        - Passkey
      summary: Complete adding a passkey
      description: Completes WebAuthn registration to add a new passkey
      operationId: addPasskeyFinish
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegisterFinishRequest'
      responses:
        '200':
          description: Passkey added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              example:
                ok: true
                message: Passkey added successfully
        '400':
          description: Invalid credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              example:
                ok: false
                error: Registration failed
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              example:
                ok: false
                error: Authentication required

  /auth/api/passkey/delete:
    post:
      tags:
        - Passkey
      summary: Delete a passkey
      description: |
        Removes a passkey from the user's account. Cannot delete the last
        authentication method (password, passkey, or OAuth).
      operationId: deletePasskey
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletePasskeyRequest'
            example:
              credential_id: "base64-credential-id"
      responses:
        '200':
          description: Passkey deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              example:
                ok: true
                message: Passkey deleted
        '400':
          description: Cannot delete last auth method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              example:
                ok: false
                error: Cannot delete last authentication method
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              example:
                ok: false
                error: Authentication required
        '404':
          description: Passkey not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
              example:
                ok: false
                error: Passkey not found

  # Admin - Users
  /auth/api/admin/users:
    get:
      tags:
        - Admin - Users
      summary: List all users
      description: Returns all users with their details including current room
      operationId: adminListUsers
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersResponse'
              example:
                ok: true
                users:
                  - id: 1
                    email: admin@example.com
                    display_name: Admin
                    verified: true
