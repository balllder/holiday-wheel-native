components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: HttpOnly cookie authentication

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          description: Health status
          example: ok
        version:
          type: string
          description: API version
          example: "1.0.0"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          description: User password

    LoginResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Whether the operation succeeded
        token:
          type: string
          description: Authentication token
        user:
          $ref: '#/components/schemas/UserInfo'
        error:
          type: string
          description: Error message if ok is false

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - display_name
      properties:
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          minLength: 8
          description: Password (minimum 8 characters)
        display_name:
          type: string
          minLength: 2
          maxLength: 24
          description: Display name (2-24 characters)
        captcha_token:
          type: string
          description: Optional CAPTCHA token

    RegisterResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Whether the operation succeeded
        message:
          type: string
          description: Success message
        errors:
          type: array
          items:
            type: string
          description: Validation errors
        user:
          $ref: '#/components/schemas/UserInfo'

    VerifyResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Whether the operation succeeded
        user:
          $ref: '#/components/schemas/UserInfo'
        error:
          type: string
          description: Error message if ok is false

    SimpleResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Whether the operation succeeded
        message:
          type: string
          description: Success message
        error:
          type: string
          description: Error message if ok is false

    UserInfo:
      type: object
      required:
        - id
        - email
        - display_name
      properties:
        id:
          type: integer
          format: int64
          description: User ID
        email:
          type: string
          format: email
          description: User email
        display_name:
          type: string
          description: User display name
        is_admin:
          type: boolean
          description: Whether user is an admin

    RoomsResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Whether the operation succeeded
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomInfo'
        error:
          type: string
          description: Error message if ok is false

    RoomInfo:
      type: object
      required:
        - name
        - player_count
        - total_slots
      properties:
        name:
          type: string
          description: Room name
        player_count:
          type: integer
          description: Number of players in room
        total_slots:
          type: integer
          description: Maximum players allowed

    # OAuth Schemas
    GoogleAuthRequest:
      type: object
      properties:
        id_token:
          type: string
          description: Google ID token (JWT) from mobile SDK
        access_token:
          type: string
          description: Google access token from OAuth flow

    AppleAuthRequest:
      type: object
      required:
        - identity_token
      properties:
        identity_token:
          type: string
          description: Apple identity token (JWT)
        user_identifier:
          type: string
          description: Apple user identifier
        email:
          type: string
          format: email
          description: User email (only on first auth)
        full_name:
          $ref: '#/components/schemas/AppleFullName'

    AppleFullName:
      type: object
      properties:
        given_name:
          type: string
          description: First name
        family_name:
          type: string
          description: Last name

    OAuthResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Whether the operation succeeded
        token:
          type: string
          description: Authentication token
        user:
          $ref: '#/components/schemas/UserInfo'
        is_new_user:
          type: boolean
          description: Whether this is a new registration
        error:
          type: string
          description: Error message if ok is false

    # Passkey Schemas
    PasskeyRegisterStartRequest:
      type: object
      required:
        - email
        - display_name
      properties:
        email:
          type: string
          format: email
          description: User email address
        display_name:
          type: string
          description: User display name

    PasskeyRegisterFinishRequest:
      type: object
      required:
        - email
        - credential
      properties:
        email:
          type: string
          format: email
          description: User email address
        credential:
          type: object
          description: WebAuthn credential response

    PasskeyLoginStartRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User email address (required)

    PasskeyLoginFinishRequest:
      type: object
      required:
        - credential
      properties:
        credential:
          type: object
          description: WebAuthn credential response

    PasskeyStartResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Whether the operation succeeded
        options:
          type: object
          description: WebAuthn options for navigator.credentials
        error:
          type: string
          description: Error message if ok is false

    PasskeyAuthResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Whether the operation succeeded
        token:
          type: string
          description: Authentication token
        user:
          $ref: '#/components/schemas/UserInfo'
        error:
          type: string
          description: Error message if ok is false

    PasskeyListResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Whether the operation succeeded
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyInfo'
        error:
          type: string
          description: Error message if ok is false

    PasskeyInfo:
      type: object
      required:
        - id
        - created_at
      properties:
        id:
          type: string
          description: Credential ID
        device_name:
          type: string
          description: Device name
        created_at:
          type: integer
          format: int64
          description: Unix timestamp when created
        last_used_at:
          type: integer
          format: int64
          description: Unix timestamp when last used

    AddPasskeyStartRequest:
      type: object
      properties:
        device_name:
          type: string
          description: Name for this passkey/device

    DeletePasskeyRequest:
      type: object
      required:
        - credential_id
      properties:
        credential_id:
          type: string
          description: Credential ID to delete

    # Admin Schemas
    AdminUsersResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserInfo'
        error:
          type: string

    AdminUserInfo:
      type: object
      required:
        - id
        - email
        - display_name
        - verified
        - is_admin
        - created_at
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        display_name:
          type: string
        verified:
          type: boolean
        is_admin:
          type: boolean
        created_at:
          type: integer
          format: int64
        last_login_at:
          type: integer
          format: int64
        current_room:
          type: string

    SetAdminRequest:
      type: object
      required:
        - is_admin
      properties:
        is_admin:
          type: boolean

    AdminPacksResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        packs:
          type: array
          items:
            $ref: '#/components/schemas/PackInfo'
        error:
          type: string

    PackInfo:
      type: object
      required:
        - id
        - name
        - puzzle_count
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        puzzle_count:
          type: integer
          format: int64

    CreatePackRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    CreatePackResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        id:
          type: integer
          format: int64
        message:
          type: string
        error:
          type: string

    AdminPuzzlesResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        puzzles:
          type: array
          items:
            $ref: '#/components/schemas/PuzzleInfo'
        error:
          type: string

    PuzzleInfo:
      type: object
      required:
        - id
        - category
        - answer
        - pack_id
        - enabled
      properties:
        id:
          type: integer
          format: int64
        category:
          type: string
        answer:
          type: string
        pack_id:
          type: integer
          format: int64
        enabled:
          type: boolean

    AddPuzzleRequest:
      type: object
      required:
        - category
        - answer
        - pack_id
      properties:
        category:
          type: string
        answer:
          type: string
        pack_id:
          type: integer
          format: int64

    ImportPuzzlesRequest:
      type: object
      required:
        - puzzles
      properties:
        puzzles:
          type: array
          items:
            type: object
            required:
              - category
              - answer
            properties:
              category:
                type: string
              answer:
                type: string
        pack_id:
          type: integer
          format: int64
          description: Existing pack ID (mutually exclusive with pack_name)
        pack_name:
          type: string
          description: Create or get pack by name (mutually exclusive with pack_id)

    AdminRoomsResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/AdminRoomInfo'
        error:
          type: string

    AdminRoomInfo:
      type: object
      required:
        - name
        - player_count
        - phase
        - has_host
        - players
        - revealed_count
        - total_letters
      properties:
        name:
          type: string
        player_count:
          type: integer
        phase:
          type: string
        has_host:
          type: boolean
        players:
          type: array
          items:
            $ref: '#/components/schemas/AdminPlayerInfo'
        active_idx:
          type: integer
        puzzle_category:
          type: string
        puzzle_answer:
          type: string
        revealed_count:
          type: integer
        total_letters:
          type: integer
        current_wedge:
          type: string

    AdminPlayerInfo:
      type: object
      required:
        - name
        - total
        - round_bank
        - is_connected
      properties:
        name:
          type: string
        total:
          type: integer
        round_bank:
          type: integer
        is_connected:
          type: boolean

    CreateRoomRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"

    SettingsResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        config:
          $ref: '#/components/schemas/RoomConfig'
        error:
          type: string

    RoomConfig:
      type: object
      properties:
        vowel_cost:
          type: integer
          default: 250
        final_seconds:
          type: integer
          default: 60
        final_jackpot:
          type: integer
          default: 25000
        puzzle_display_seconds:
          type: integer
          default: 5
        prize_wedge_names:
          type: array
          items:
            type: string
        pack_id:
          type: integer
          format: int64
        disconnect_timeout_secs:
          type: integer
          format: int64
          default: 120

    SaveSettingsRequest:
      type: object
      properties:
        puzzle_display_seconds:
          type: integer
        vowel_cost:
          type: integer
        final_seconds:
          type: integer
        final_jackpot:
          type: integer
        prize_wedge_names:
          type: array
          items:
            type: string
        pack_id:
          type: integer
          format: int64
          description: Set to 0 for all packs
        disconnect_timeout_secs:
          type: integer
          format: int64
