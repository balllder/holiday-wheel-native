name: Template Validation

on:
  push:
    branches:
      - main
      - rust-axum-react
      - python-fastapi-react
      - nodejs-express-react
  pull_request:
    branches:
      - main

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate directory structure
        run: |
          echo "Validating template structure..."

          # Check required directories
          required_dirs=(
            "docs/methodology"
            "docs/testing"
            "docs/api-codegen"
            "docs/monitoring"
            "templates/milestone"
            "templates/user-story"
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing required directory: $dir"
              exit 1
            else
              echo "✓ Found: $dir"
            fi
          done

      - name: Validate required files
        run: |
          echo "Validating required files..."

          required_files=(
            "README.md"
            "CLAUDE.md"
            "docs/testing/TESTING_GUIDE.md"
            "docs/testing/E2E_TESTING.md"
            "docs/testing/API_TESTING_REQUIREMENTS.md"
            "docs/methodology/DEV_FIRST_APPROACH.md"
            "docs/methodology/SHARING_STRATEGY.md"
            "templates/milestone/TEMPLATE.md"
            "templates/user-story/TEMPLATE.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            else
              echo "✓ Found: $file"
            fi
          done

      - name: Validate markdown links
        run: |
          echo "Checking for broken internal links..."
          # Simple check for common broken link patterns
          if grep -r "\](docs/" . --include="*.md" | grep -v "https://github.com"; then
            echo "⚠️  Found potential broken links (review manually)"
          else
            echo "✓ No obvious broken links detected"
          fi

      - name: Check for TODO markers
        run: |
          echo "Checking for unresolved TODOs..."
          if grep -r "TODO:" docs/ --include="*.md" | grep -v "example" | grep -v "Optional"; then
            echo "⚠️  Found TODO markers - review before release"
          else
            echo "✓ No critical TODOs found"
          fi

  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate code examples in documentation
        run: |
          echo "Validating code block syntax in markdown files..."

          # Check for unclosed code blocks
          for file in $(find docs -name "*.md"); do
            backtick_count=$(grep -o '```' "$file" | wc -l)
            if [ $((backtick_count % 2)) -ne 0 ]; then
              echo "❌ Unclosed code block in: $file"
              exit 1
            fi
          done

          echo "✓ All code blocks properly formatted"

  summary:
    runs-on: ubuntu-latest
    needs: [validate-structure, validate-examples]
    steps:
      - name: Validation complete
        run: |
          echo "✅ Template validation successful!"
          echo "Template is ready for distribution."
