name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Required for backend tests after HOST_CODE security hardening
  HOST_CODE: "ci-test-secure-code-12345"

jobs:
  # Validate embedded JavaScript in Rust backend
  validate-embedded-js:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract embedded JavaScript from Rust
        run: node scripts/extract-rust-js.js

      - name: Validate extracted JavaScript syntax
        run: node scripts/validate-rust-js.js

  # Rust backend lint and test
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend-rust

      - name: Check formatting
        run: cd apps/backend-rust && cargo fmt -- --check

      - name: Run clippy
        run: cd apps/backend-rust && cargo clippy -- -D warnings

      - name: Run tests
        run: cd apps/backend-rust && cargo test -- --test-threads=1
        env:
          HOST_CODE: ${{ env.HOST_CODE }}

  lint-and-test:
    needs: [validate-embedded-js, backend-test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run check-types

      - name: Run tests with coverage
        run: npx turbo run test --filter='!@holiday-wheel/e2e' -- --coverage --passWithNoTests

  # Browser-based E2E tests with Playwright
  e2e-tests:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend-rust

      - name: Install E2E dependencies
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Build backend
        run: |
          cd apps/backend-rust
          cargo build --release

      - name: Run E2E tests
        run: |
          cd e2e
          npm test
        env:
          CI: true

  # Build and push Docker image (only on push to main)
  build-backend-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: gitea.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: https://github.com/docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: ./apps/backend-rust
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/holiday-wheel-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/holiday-wheel-backend:${{ gitea.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
