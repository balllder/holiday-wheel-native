version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: project-starter-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_starter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # BuildKit optimizations for faster builds
      args:
        BUILDKIT_INLINE_CACHE: 1
      cache_from:
        - project-starter-backend:latest
    image: project-starter-backend:latest
    container_name: project-starter-backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/project_starter
      PORT: 3000
      RUST_LOG: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Note: Production build doesn't mount source code
    # For development with hot reload, use docker-compose.dev.yml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: project-starter-frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
