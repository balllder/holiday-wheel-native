name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Validate embedded JavaScript in Rust backend
  validate-embedded-js:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract embedded JavaScript from Rust
        run: node scripts/extract-rust-js.js

      - name: Validate extracted JavaScript syntax
        run: node scripts/validate-rust-js.js

      - name: Upload extracted JS (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extracted-js
          path: .extracted-js/
          retention-days: 7

  lint-and-test:
    needs: validate-embedded-js
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run check-types

      - name: Run tests with coverage
        run: npx turbo run test --filter='!@holiday-wheel/e2e' -- --coverage --passWithNoTests

      - name: Upload coverage reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/shared/coverage/
            apps/phone/coverage/
            apps/tv/coverage/
          retention-days: 14

  # Browser-based E2E tests with Playwright
  e2e-tests:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend-rust

      - name: Install E2E dependencies
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Build backend
        run: |
          cd apps/backend-rust
          cargo build --release

      - name: Run E2E tests
        run: |
          cd e2e
          npm test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: e2e/test-results/
          retention-days: 7

